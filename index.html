<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Network Visualizer</title>
    <link href="https://cdn.jsdelivr.net/npm/firacode-nerd-font@3.2.1/css/firacode-nerd-font.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['ui-sans-serif', 'system-ui'],
              'nerd': ['FiraCode Nerd Font', 'monospace']
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(-5px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              }
            },
            colors: {
              'gray-900': '#121212',
              'gray-800': '#1e1e1e',
              'gray-700': '#2d2d2d',
              'gray-600': '#3c3c3c',
              'gray-500': '#6b7280',
              'gray-400': '#a0a0a0',
              'gray-300': '#d1d5db',
              'gray-200': '#e0e0e0',
              accent: '#55B6C2',
              ont: '#98C379',
              firewall: '#E06B74',
              scanner: '#E5C07A',
              server: '#E0B8FF',
              other: '#a0a0a0'
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "d3": "https://aistudiocdn.com/d3@^7.9.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900 text-gray-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
